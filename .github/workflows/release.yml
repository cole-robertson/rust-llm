name: Release

# Publishes rust_llm, rust_llm_loco and rust_llm_cli to crates.io with trusted publishing: no API
# token is stored anywhere. rust-lang/crates-io-auth-action exchanges this job's GitHub OIDC token
# for a short-lived crates.io token and revokes it when the job ends.
#
# One-time setup, per crate (crates.io cannot trust a workflow for a crate that does not exist yet):
#   1. `cargo publish -p rust_llm`, then `-p rust_llm_loco`, then `-p rust_llm_cli`, from a
#      maintainer's machine with a normal token.
#   2. On each crate's crates.io Settings -> Trusted Publishing, add: owner cole-robertson,
#      repository rust-llm, workflow release.yml, environment blank.
# After that, pushing a tag `v2.0.1` publishes 2.0.1. `gh workflow run release.yml` checks the
# token exchange without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Proves crates.io trusts this workflow file, and publishes nothing. Publishers are registered
  # per workflow file, so the check has to live in this file to mean anything.
  verify_trusted_publishing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Report
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ -z "$TOKEN" ]; then echo "The exchange succeeded but returned no token."; exit 1; fi
          echo "crates.io trusted this workflow and issued a publish token. A v* tag will publish."

  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tag names the release, but Cargo.toml decides what gets published: they must agree.
      - name: Tag and workspace version agree
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rust_llm") | .version')"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME asks for $tagged, but Cargo.toml says $declared."
            exit 1
          fi
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # In dependency order. A version already on crates.io is skipped, so re-running a
      # half-finished release completes it instead of failing on the first crate.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in rust_llm rust_llm_loco rust_llm_cli; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -A 'rust-llm release (github.com/cole-robertson/rust-llm)' \
              "https://crates.io/api/v1/crates/$crate/$version")"
            if [ "$code" = "200" ]; then
              echo "$crate $version is already published; skipping."
              continue
            fi
            cargo publish -p "$crate"
          done
