[package]
name = "rust_llm_loco"
description = "Persist rust_llm chats, messages, tool calls, and usage in Loco apps with SeaORM."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.94"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rust_llm_loco"
readme = "README.md"
keywords = ["llm", "ai", "loco", "sea-orm", "chat"]
categories = ["database", "web-programming"]
# Tests replay 64 MB of RubyLLM cassettes (over crates.io's 10 MB limit), so they run from the
# git repository only; the package ships the library source.
include = ["src/**/*.rs", "README.md", "LICENSE"]

[dependencies]
rust_llm = { path = "../rust_llm", version = "2.0.0" }
aes-gcm = "0.10"
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
serde = { workspace = true }
tokio.workspace = true
wiremock = "0.6"
