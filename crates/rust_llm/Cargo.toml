[package]
name = "rust_llm"
description = "A 1:1 Rust port of RubyLLM 2.0: one API for chat, tools, agents, and embeddings across providers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rust_llm"
readme = "README.md"
keywords = ["llm", "ai", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
# Tests replay 64 MB of RubyLLM cassettes (over crates.io's 10 MB limit), so they run from the
# git repository only; the package ships the library, its bundled model registry, and examples.
include = ["src/**/*.rs", "data/*.json", "examples/*.rs", "README.md", "LICENSE"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
mime_guess.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "net"] }
tracing.workspace = true
uuid.workspace = true
unicode-normalization.workspace = true
minijinja.workspace = true
# WebSocket transport for streaming transcription (Gemini Live, xAI), over rustls with ring like reqwest.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[dev-dependencies]
futures.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde_yaml = "0.9"
wiremock = "0.6"
