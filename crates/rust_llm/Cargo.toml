[package]
name = "rust_llm"
description = "A 1:1 Rust port of RubyLLM 2.0: one API for chat, tools, agents, and embeddings across providers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rust_llm"
readme = "README.md"
keywords = ["llm", "ai", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
# Tests replay 64 MB of RubyLLM cassettes (over crates.io's 10 MB limit), so they run from the
# git repository only; the package ships the library, its bundled model registry, and examples.
include = ["src/**/*.rs", "data/*.json", "examples/*.rs", "README.md", "LICENSE"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
mime_guess.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
futures.workspace = true
serde_yaml = "0.9"
wiremock = "0.6"
