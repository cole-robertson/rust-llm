[package]
name = "rust_llm_cli"
description = "RubyLLM's Rails generators as a CLI for Loco + Inertia + React apps: install, tool, agent, schema, chat_ui, provider, upgrade."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.94"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rust_llm_cli"
readme = "README.md"
keywords = ["llm", "ai", "loco", "generator", "inertia"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
# Tests (and the e2e harness) run from the git repository only; the package ships the CLI and the
# templates it embeds with include_str!.
include = ["src/**/*.rs", "templates/**/*", "README.md", "LICENSE"]

[[bin]]
name = "rust-llm"
path = "src/main.rs"
# The bin's doc name (rust_llm) collides with the rust_llm library's in `cargo doc --workspace`.
doc = false

[dependencies]
# `tool::underscore` keeps generated tool file names equal to the runtime `Tool::name()`.
rust_llm = { path = "../rust_llm", version = "2.0.0" }
chrono.workspace = true

[dev-dependencies]
tempfile = "3"
# tests/spec_generators.rs compiles the install/upgrade migration and model templates and runs
# them against SQLite; syn checks that core wiring the provider generator rewrites still parses.
rust_llm_loco = { path = "../rust_llm_loco" }
async-trait.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde_json.workspace = true
syn = { version = "2", features = ["full"] }
tokio.workspace = true
