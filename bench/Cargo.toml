[package]
name = "rust_llm_bench"
description = "RustLLM vs RubyLLM benchmarks: a mock Anthropic server and the Rust client. Not published."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace, so the benchmark's dependencies never touch the library's Cargo.lock.
[workspace]

[dependencies]
rust_llm = { path = "../crates/rust_llm" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }

[profile.release]
debug = "line-tables-only"
