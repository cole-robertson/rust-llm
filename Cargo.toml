[workspace]
resolver = "3"
members = ["crates/rust_llm", "crates/rust_llm_loco", "crates/rust_llm_cli", "docs/check"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
authors = ["Cole Robertson"]
repository = "https://github.com/cole-robertson/rust-llm"
homepage = "https://github.com/cole-robertson/rust-llm"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
mime_guess = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
schemars = "1.2"
sea-orm = { version = "2.0", default-features = false, features = ["macros", "with-json", "with-chrono", "runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
